# LabelCheck — Scan any packaged food, know what's in it in 2 seconds, privately.
# Generated with XcodeGen. Never commit a .xcodeproj.
# Generate: xcodegen generate
# Then open LabelCheck.xcodeproj in Xcode 26 and build for iOS 17 or later.
name: LabelCheck
options:
  bundleIdPrefix: com.singhsec
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_NAME: AccentColor
  debug:
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  release:
    SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  LabelCheck:
    type: application
    platform: iOS
    sources:
      - path: LabelCheck
        excludes:
          - "**/Info.plist"
      - path: Resources/Assets.xcassets
      # The .storekit file is a bundle resource in v1 so the screenshot-mode
      # paywall can read the same prices from it. It contains public pricing
      # only — no secrets. The scheme also references it as the StoreKit
      # configuration for Run.
      - path: Resources/LabelCheck.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singhsec.labelcheck
        INFOPLIST_FILE: LabelCheck/Info.plist
        PRIVACY_MANIFEST_FILE: Resources/PrivacyInfo.xcprivacy
        SWIFT_DATA_ENABLED: YES
    info:
      path: LabelCheck/Info.plist
      properties:
        CFBundleDisplayName: LabelCheck
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Rule (from Clear Days): XcodeGen REWRITES the plist on every
        # `xcodegen generate` from the keys listed here. Any key that
        # lives only in the checked-in plist is silently dropped from
        # the built app. So every key the app needs must be listed here.
        CFBundleName: LabelCheck
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "LabelCheck uses the camera to scan barcodes and food labels. Images stay on this phone."
  LabelCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LabelCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singhsec.labelcheck.tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # The test target has no Info.plist file of its own. Without
        # this, Xcode 26 fails the test lane in CI: "Cannot code sign
        # because the target does not have an Info.plist file and one
        # is not being generated automatically."
        GENERATE_INFOPLIST_FILE: YES
  # App Store screenshots. A UI test target, not a unit test target: it
  # launches the real app in screenshot mode (bundled sample data, no
  # network) and captures the seven screens. Runs only in the screenshots
  # lane, never in the everyday test lane, because simulator screenshots
  # cost macOS minutes.
  LabelCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LabelCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singhsec.labelcheck.uitests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LabelCheck:
    build:
      targets:
        LabelCheck: all
    run:
      config: Debug
      storeKitConfiguration: "Resources/LabelCheck.storekit"
    test:
      config: Debug
      targets:
        - LabelCheckTests
        - LabelCheckUITests
    archive:
      config: Release
